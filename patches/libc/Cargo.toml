# Stand-in for the `libc` crate, applied only to wasm32-unknown-unknown builds
# (see .cargo/wasm-patch.toml). The real libc has no definitions for that
# target, but `bitcoinconsensus` is the only crate in the wasm dependency graph
# that needs it, and all it wants are a few C integer type aliases that
# core::ffi provides.
#
# Native builds do not use this - they get the real libc.
[package]
name = "libc"
version = "0.2.189"
edition = "2021"
publish = false

[lib]
name = "libc"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
extra_traits = []
align = []
